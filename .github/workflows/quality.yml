name: 验证平台
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  behavior:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.7'
      - run: python -m pip install uv==0.11.6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
