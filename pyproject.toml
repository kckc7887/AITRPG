[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "aitrpg"
version = "0.1.0"
description = "本地多模型 CoC7 跑团平台"
requires-python = ">=3.13,<3.14"
dependencies = [
    "nicegui==3.17.1",
    "fastapi==0.142.2",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.1.3",
    "alembic==1.20.0",
    "httpx==0.28.1",
    "mcp==2.3.0",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "pypdf==6.19.0",
    "pypdfium2==5.14.0",
    "pillow==12.3.0",
    "keyring==25.7.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.10",
]

[project.scripts]
aitrpg = "aitrpg.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aitrpg"]

[tool.ruff]
line-length = 79
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
